[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "payroll_indonesia"
authors = [{name = "IMOGI", email = "hello@imogi.tech"}]
description = "Payroll Indonesia - Modul Perhitungan BPJS & PPh 21 untuk ERPNext Indonesia"
requires-python = ">=3.10"
readme = "README.md"
version = "1.0.0"
dependencies = [
    "frappe>=15.0.0",
    "erpnext>=15.0.0",
    "PyPika @ git+https://github.com/frappe/pypika@2c50e6142b2d61d2d243e466fdd5dc03b3d918f2",
    "gunicorn @ git+https://github.com/frappe/gunicorn@bb554053bb87218120d76ab6676af7015680e8b6"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit"
]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
erpnext = ">=15.0.0"

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pytest.ini_options]
testpaths = ["payroll_indonesia"]
